name: Adicionar favicon
on:
  push:
    paths:
      - 'favicon.svg'
permissions:
  contents: write
jobs:
  favicon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adicionar favicon ao head
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='  <meta name="theme-color" content="#08080a" />'
          line='  <link rel="icon" href="favicon.svg" type="image/svg+xml" />'
          if line not in s:
              s=s.replace(marker, marker+'\n'+line)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "liga favicon do Capital do Engano"
          git push