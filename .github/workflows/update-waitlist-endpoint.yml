name: Atualizar endpoint de inscrições

on:
  push:
    paths:
      - '.github/workflows/update-waitlist-endpoint.yml'

permissions:
  contents: write

jobs:
  update-endpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trocar endpoint antigo pelo novo
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = 'https://script.google.com/macros/s/AKfycbzYLCKbPBCM4puSawS359DqaYR9gjI7DsGg2wBYST9x6eAuBHs6U4PNbtvz9EUPN5R0jQ/exec'
          new = 'https://script.google.com/macros/s/AKfycbwLwXu7yA2k3YvWyBqOMSSfnzRwR58wXxqY4SEbpK5EW2DYldIZgKlH9GmjTxIQWyBG/exec'
          if old not in text:
              raise SystemExit('Endpoint antigo não encontrado em index.html')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Commit da alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "liga formulário ao Apps Script final"
          git push
