name: Corrigir envio do formulario
on:
  push:
    paths:
      - '.github/workflows/revert-form-json.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restaurar POST em JSON
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="const payload=new URLSearchParams({email,origem:'capital-do-engano-home-v1.5',consentiu:'true',turma,interesse});\n      try{await fetch(WAITLIST_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:payload.toString()});}catch(e){}"
          new="const payload={email,origem:'capital-do-engano-home-v1.5',consentiu:true,turma,interesse};\n      try{await fetch(WAITLIST_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});}catch(e){}"
          if old not in s:
              raise SystemExit('trecho esperado nao encontrado')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "restaura envio JSON para Apps Script"
          git push